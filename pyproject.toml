[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-agent"
version = "0.1.0"
description = "Claude-powered IAM & UEM orchestration agent: Entra ID, M365, on-prem AD, Action1 and Scalefusion for automated onboarding/offboarding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IAM_AGENT" }]
keywords = ["iam", "entra", "microsoft365", "active-directory", "action1", "scalefusion", "mcp", "claude"]

dependencies = [
    # --- Core / config ---
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0",
    # --- HTTP / auth ---
    "httpx>=0.27",
    "msal>=1.28",
    # --- On-prem Active Directory ---
    "ldap3>=2.9.1",
    # --- Interfaces ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    # --- Claude / MCP ---
    "mcp>=1.2.0",
    "anthropic>=0.34",
    # --- Utilities ---
    "pyyaml>=6.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
iam-agent = "iam_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iam_agent = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
